<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>UI Options</title>
  <style>
    :root {
      --bg: #f4f4f2;
      --bar: #ffffff;
      --text: #1c1c1a;
      --muted: #6b6b66;
      --border: #e2e2dd;
      --accent: #1c1c1a;
      --accent-text: #ffffff;
      --stage: #e9e9e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #161615;
        --bar: #1f1f1d;
        --text: #f0f0ec;
        --muted: #9a9a94;
        --border: #33332f;
        --accent: #f0f0ec;
        --accent-text: #161615;
        --stage: #121211;
      }
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex;
      flex-direction: column;
      background: var(--bg);
      color: var(--text);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }

    header {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      padding: 10px 16px;
      background: var(--bar);
      border-bottom: 1px solid var(--border);
    }
    .title { font-weight: 600; margin-right: auto; }
    .title small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }

    .seg {
      display: inline-flex;
      padding: 3px;
      gap: 2px;
      border: 1px solid var(--border);
      border-radius: 10px;
      background: var(--bg);
    }
    .seg button {
      border: 0;
      background: transparent;
      color: var(--text);
      font: inherit;
      padding: 6px 14px;
      border-radius: 7px;
      cursor: pointer;
      white-space: nowrap;
    }
    .seg button:hover { background: var(--border); }
    .seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-text); }
    .seg button kbd { opacity: .5; font: 11px ui-monospace, monospace; margin-left: 6px; }

    .open-link { color: var(--muted); text-decoration: none; font-size: 13px; }
    .open-link:hover { color: var(--text); text-decoration: underline; }

    .desc {
      padding: 8px 16px;
      color: var(--muted);
      font-size: 13px;
      border-bottom: 1px solid var(--border);
      background: var(--bar);
    }
    .desc:empty { display: none; }

    main {
      flex: 1;
      display: flex;
      justify-content: center;
      align-items: stretch;
      background: var(--stage);
      overflow: auto;
      min-height: 0;
    }
    main.framed { padding: 24px 16px; }
    iframe {
      border: 0;
      width: 100%;
      height: 100%;
      background: #fff;
      transition: width .2s ease;
    }
    main.framed iframe {
      border-radius: 14px;
      box-shadow: 0 0 0 1px var(--border), 0 10px 30px rgba(0,0,0,.12);
    }

    @media (max-width: 640px) {
      .device, .open-link, .seg button kbd { display: none; }
    }
  </style>
</head>
<body>
  <header>
    <div class="title">
      <span id="project-name">UI Options</span>
      <small>Compare the versions and pick your favourite</small>
    </div>
    <div class="seg" id="versions" role="group" aria-label="Version"></div>
    <div class="seg device" id="devices" role="group" aria-label="Screen size">
      <button data-width="100%">Desktop</button>
      <button data-width="820px">Tablet</button>
      <button data-width="390px">Mobile</button>
    </div>
    <a class="open-link" id="open" target="_blank" rel="noopener">Open full screen ↗</a>
  </header>
  <div class="desc" id="desc"></div>
  <main id="stage">
    <iframe id="frame" title="Selected version"></iframe>
  </main>

  <script src="versions.js"></script>
  <script>
    const { projectName, versions } = window.UI_OPTIONS;
    const frame = document.getElementById('frame');
    const stage = document.getElementById('stage');
    const versionBar = document.getElementById('versions');
    const deviceBar = document.getElementById('devices');
    const desc = document.getElementById('desc');
    const openLink = document.getElementById('open');

    if (projectName) {
      document.getElementById('project-name').textContent = projectName;
      document.title = projectName;
    }

    versions.forEach((v, i) => {
      const b = document.createElement('button');
      b.innerHTML = `${v.name}<kbd>${i + 1}</kbd>`;
      b.onclick = () => selectVersion(i);
      versionBar.appendChild(b);
    });

    function selectVersion(i) {
      const v = versions[i];
      if (!v) return;
      if (frame.getAttribute('src') !== v.src) frame.src = v.src;
      openLink.href = v.src;
      desc.textContent = v.description || '';
      [...versionBar.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
      history.replaceState(null, '', '#' + (i + 1));
      current = i;
    }

    function selectDevice(btn) {
      const w = btn.dataset.width;
      frame.style.width = w;
      stage.classList.toggle('framed', w !== '100%');
      [...deviceBar.children].forEach(b => b.setAttribute('aria-pressed', b === btn));
    }
    [...deviceBar.children].forEach(b => b.onclick = () => selectDevice(b));

    // Keyboard: 1/2/3 pick a version, ←/→ cycle through them
    let current = 0;
    document.addEventListener('keydown', e => {
      if (e.target.closest('input, textarea')) return;
      const n = parseInt(e.key, 10);
      if (n >= 1 && n <= versions.length) selectVersion(n - 1);
      else if (e.key === 'ArrowRight') selectVersion((current + 1) % versions.length);
      else if (e.key === 'ArrowLeft') selectVersion((current - 1 + versions.length) % versions.length);
    });

    const fromHash = parseInt(location.hash.slice(1), 10) - 1;
    selectVersion(fromHash >= 0 && fromHash < versions.length ? fromHash : 0);
    selectDevice(deviceBar.children[0]);
  </script>
</body>
</html>
