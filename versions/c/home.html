<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Italian Lessons — Home</title>
<!-- Homepage for Option C, taken from the Claude Design UI kit (ui_kits/booking).
     Shown inside index.html's Home tab; "Book a lesson" asks the parent page to switch to the calendar. -->
<link rel="stylesheet" href="home/styles.css">
<style>*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font-sans)}a{color:var(--accent)}a:hover{color:var(--fg)}</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js"></script>
<script src="home/image-slot.js"></script>
<script type="text/babel" src="home/HomeScreen.jsx"></script>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const goBooking = () => window.parent.postMessage({ ilNavigate: 'booking' }, '*');
ReactDOM.createRoot(document.getElementById('root')).render(<HomeScreen onBook={goBooking} />);
</script>
</body>
</html>
